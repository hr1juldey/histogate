<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="400" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">How the demo serves a doctor from my desk</text><rect x="40" y="90" width="180" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="130.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Visitor</text><text x="130.0" y="138" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">opens the site</text><text x="130.0" y="156" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">from anywhere</text><rect x="250" y="90" width="170" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="335.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Vercel</text><text x="335.0" y="138" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">free hosting for the</text><text x="335.0" y="156" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">website itself</text><rect x="450" y="90" width="180" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="540.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Wake router</text><text x="540.0" y="138" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">backend asleep?</text><text x="540.0" y="156" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">it says "waking up..."</text><rect x="660" y="90" width="120" height="90" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="720.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">GPU</text><text x="720.0" y="138" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the graphics card</text><text x="720.0" y="156" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">under my desk</text><text x="720.0" y="174" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">sleeps, wakes, works</text><line x1="220" y1="125" x2="250" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="125" x2="450" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="630" y1="125" x2="660" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><text x="645.0" y="117.0" text-anchor="middle" font-size="11.5" fill="#777" font-family="Helvetica, Arial, sans-serif">GET /wake</text><text x="400" y="215" text-anchor="middle" font-size="13" fill="#555" font-family="Helvetica, Arial, sans-serif">cold start: asleep to answering in 75 seconds &#183; shuts down after 20 minutes alone &#183; cloud GPU bill: 0</text><rect x="200" y="240" width="400" height="50" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="400.0" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">What visitors see</text><text x="400.0" y="288" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">known slides load instantly from saved snapshots</text><text x="400.0" y="306" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">only YOUR uploaded images wake the GPU</text></svg>