<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="400" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The 9-question exam my AI must pass before it ships</text><rect x="40" y="70" width="220" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="150.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">1. Patient split check</text><text x="150.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">no patient appears on both</text><text x="150.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the study list and the exam list</text><text x="150.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">(else the score is memory, not skill)</text><rect x="290" y="70" width="220" height="80" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/><text x="400.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">2. Cheat the scoreboard</text><text x="400.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">shuffle all labels, retrain,</text><text x="400.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">the pipeline must score ~random</text><text x="400.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">(if it can be cheated, it will be)</text><rect x="540" y="70" width="220" height="80" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/><text x="650.0" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">3. Real-scanner images</text><text x="650.0" y="118" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">images straight from a hospital</text><text x="650.0" y="136" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">scanner, no cleanup.</text><text x="650.0" y="154" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">This is where it first broke.</text><rect x="165" y="190" width="220" height="80" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/><text x="275.0" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">4. Damaged images</text><text x="275.0" y="238" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">blur, folds, air bubbles.</text><text x="275.0" y="256" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">How well does it say "I am</text><text x="275.0" y="274" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">not sure"? Score 0.83. Bar: 0.90. FAIL.</text><rect x="415" y="190" width="220" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="525.0" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">5..9. Accuracy, calibration,</text><text x="525.0" y="238" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">speed, memory, the compressed</text><text x="525.0" y="256" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">deployment copy.</text><text x="525.0" y="274" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">All must clear their own bar.</text><line x1="150" y1="150" x2="165" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="600" y1="150" x2="550" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="310" text-anchor="middle" font-size="14" fill="#555" font-family="Helvetica, Arial, sans-serif">First run: 6 of 9 passed. The two red boxes found real problems a normal test never shows.</text></svg>