<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310"><rect width="100%" height="100%" fill="#fafafa"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><text x="400" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Training through notes, not images</text><rect x="40" y="80" width="200" height="90" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/><text x="140.0" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The 307M teacher</text><text x="140.0" y="128" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">free to study, NOT free to ship</text><text x="140.0" y="146" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">(its license forbids products)</text><rect x="300" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/><text x="400.0" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">It writes notes</text><text x="400.0" y="128" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">each image becomes a list of</text><text x="400.0" y="146" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">numbers describing what it sees.</text><text x="400.0" y="164" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">100k images, one pass, saved to disk.</text><rect x="560" y="80" width="200" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="660.0" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">The 6M student</text><text x="660.0" y="128" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">learns from the notes.</text><text x="660.0" y="146" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">The teacher never runs again.</text><line x1="240" y1="125" x2="300" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><line x1="500" y1="125" x2="560" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/><rect x="240" y="230" width="320" height="60" rx="10" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="400.0" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#111" font-family="Helvetica, Arial, sans-serif">Result</text><text x="400.0" y="278" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">student scores 94.7% on 100k images</text><text x="400.0" y="296" text-anchor="middle" font-size="12.5" fill="#444" font-family="Helvetica, Arial, sans-serif">teacher stays 100% legal</text><line x1="660" y1="170" x2="520" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arr)"/></svg>