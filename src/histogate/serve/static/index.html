<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HistoGate — patch demo</title>
<style>
 body{font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6;margin:0;padding:24px}
 h1{font-size:20px;margin:0 0 4px} .sub{color:#8b93a1;font-size:13px;margin-bottom:20px}
 #drop{border:2px dashed #444;border-radius:12px;padding:40px;text-align:center;color:#8b93a1;cursor:pointer;transition:.2s}
 #drop.hot{border-color:#4f9cf9;color:#4f9cf9}
 .wrap{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap}
 .card{background:#161a22;border-radius:12px;padding:16px;flex:1;min-width:320px}
 canvas{width:224px;height:224px;border-radius:8px;image-rendering:pixelated}
 .bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
 .bar .lbl{width:52px;text-align:right;color:#aab}
 .bar .tr{flex:1;background:#222834;border-radius:4px;height:14px}
 .bar .fl{height:14px;border-radius:4px;background:#3d7dca}
 .verdict{font-size:16px;font-weight:600;padding:10px;border-radius:8px;background:#1d2620;margin-bottom:12px}
 .verdict.ood{background:#2d1d1d;color:#ff9d9d}
 .meta{color:#8b93a1;font-size:12px;line-height:1.7}
 input[type=range]{width:224px}
</style>
</head>
<body>
<h1>HistoGate — stain-robust colorectal tissue classifier</h1>
<div class="sub">9-class patch diagnosis · temperature-calibrated confidence ·
energy OOD gate · Grad-CAM localization — Research Use Only</div>
<div id="drop">drop an H&amp;E patch (224×224 or any square) — or click to pick</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="wrap">
 <div class="card">
  <canvas id="img" width="224" height="224"></canvas>
  <div class="meta">Grad-CAM blend <input type="range" id="alpha" min="0" max="100" value="45"></div>
 </div>
 <div class="card">
  <div class="verdict" id="verdict">awaiting patch…</div>
  <div id="bars"></div>
  <div class="meta" id="meta"></div>
 </div>
</div>
<script>
const drop=document.getElementById('drop'),file=document.getElementById('file');
const cv=document.getElementById('img'),ctx=cv.getContext('2d');
let srcImg=null,cam=null;
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('hot')};
drop.ondragleave=()=>drop.classList.remove('hot');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hot');
  const f=e.dataTransfer.files[0];if(f)send(f)};
file.onchange=()=>file.files[0]&&send(file.files[0]);
async function send(f){
  srcImg=await createImageBitmap(f);
  cam=null;draw();
  const fd=new FormData();fd.append('file',f);
  const r=await fetch('/analyze-patch',{method:'POST',body:fd});
  const j=await r.json();render(j);
}
function draw(){
  if(!srcImg)return;
  ctx.drawImage(srcImg,0,0,224,224);
  if(cam){const a=+document.getElementById('alpha').value/100;
    const tmp=document.createElement('canvas');tmp.width=tmp.height=224;
    const tc=tmp.getContext('2d');
    const d=tc.createImageData(224,224);
    for(let i=0;i<224*224;i++){const v=cam[i];
      d.data[i*4]=255*v;d.data[i*4+1]=40*v;d.data[i*4+2]=40*v;d.data[i*4+3]=255*Math.min(1,v*1.4)*a}
    tc.putImageData(d,0,0);ctx.drawImage(tmp,0,0)}
}
document.getElementById('alpha').oninput=draw;
function render(j){
  cam=j.gradcam.flat();draw();
  const v=document.getElementById('verdict');
  v.textContent=j.verdict;v.className='verdict'+(j.ood?' ood':'');
  const bars=document.getElementById('bars');
  bars.innerHTML='';
  const sorted=[...j.probabilities].sort((a,b)=>b.p-a.p);
  for(const p of sorted){
    const row=document.createElement('div');row.className='bar';
    row.innerHTML=`<div class="lbl">${p.class}</div><div class="tr"><div class="fl" style="width:${(p.p*100).toFixed(1)}%"></div></div><div>${(p.p*100).toFixed(1)}%</div>`;
    bars.appendChild(row)}
  document.getElementById('meta').innerHTML=
   `energy ${j.energy} vs threshold ${j.energy_threshold} (fpr 5%)<br>`+
   `calibrated confidence ${(j.confidence*100).toFixed(1)}% · ship: pr16-mixed (8/9 gate)`;
}
</script>
</body>
</html>
