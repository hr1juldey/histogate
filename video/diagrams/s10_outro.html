<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#08090a;--t1:#f7f8f8;--t2:#d0d6e0;--t3:#8a8f98;--t4:#62666d;--brand:#5e6ad2;--accent:#7170ff;--ok:#10b981;--b:#ffffff14}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:var(--bg);color:var(--t1);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mark{display:flex;align-items:center;gap:20px;font-size:44px;font-weight:600;letter-spacing:-.5px}
.mark img{width:64px;height:64px;border-radius:14px}
.tag{color:var(--t3);font-size:24px;margin-top:26px;max-width:900px;line-height:1.6}
.tag b{color:var(--t1);font-weight:500}
.url{margin-top:56px;font-size:34px;color:var(--accent);border:1px solid #5e6ad266;background:#5e6ad214;padding:16px 38px;border-radius:12px}
.ctas{margin-top:34px;color:var(--t4);font-size:18px}
.ctas b{color:var(--t2);font-weight:500}
.ruo{position:absolute;bottom:56px;left:0;right:0;text-align:center;color:var(--t4);font-size:14px}
.glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,#5e6ad21f 0%,#08090a00 60%);top:-460px;left:260px}
</style></head><body>
<div class="glow"></div>
<div class="c">
  <div class="mark" id="mark"><img src="https://histogate.vercel.app/favicon.svg">HistoGate</div>
  <div class="tag" id="tag">reads cancer tissue · <b>tells you when it shouldn't answer</b> · every number measured, not promised</div>
  <div class="url mono" id="url">histogate.vercel.app</div>
  <div class="ctas" id="ctas">try any picture on <b>/demo</b> · drag the stain dial on <b>/story</b> · a whole foreign organ on <b>/slide</b></div>
</div>
<div class="ruo mono" id="ruo">Research Use Only — not for use in diagnostic procedures</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused:true});
tl.fromTo('#mark',{opacity:0,y:20,scale:.96},{opacity:1,y:0,scale:1,duration:.6,ease:'power2.out'},0.1);
tl.fromTo('#tag',{opacity:0,y:16},{opacity:1,y:0,duration:.5},0.5);
tl.fromTo('#url',{opacity:0,y:16},{opacity:1,y:0,duration:.5},0.85);
tl.fromTo('#ctas',{opacity:0},{opacity:1,duration:.5},1.2);
tl.fromTo('#ruo',{opacity:0},{opacity:1,duration:.5},1.4);
tl.to('#url',{ borderColor:'#828fff', boxShadow:'0 0 0 4px #5e6ad226', duration:.5, yoyo:true, repeat:1 }, 1.8);
tl.to({}, {duration: 1.2});
window.tl = tl;
</script></body></html>
