[project]
name = "histogate"
version = "0.1.0"
description = "Stain-invariant, quality-gated tissue microenvironment classifier & biomarker estimator on NCT-CRC-HE-100K. Research Use Only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hrijul Dey" }]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "numpy>=1.26",
    "openslide-python>=1.3.1",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "scipy>=1.11",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxconverter-common>=1.14",
    "tifffile>=2024.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-telegram-bot>=21.0",
    "mlflow>=3.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
histogate-train = "histogate.cli:train"
histogate-eval = "histogate.cli:eval"
histogate-export = "histogate.cli:export_bench"
histogate-gate = "histogate.cli:gate"
histogate-serve = "histogate.cli:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histogate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/histogate"]
